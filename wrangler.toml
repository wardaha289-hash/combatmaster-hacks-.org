# CI Workers Builds project name (repo: combatmastercheats)
name = "combatmaster-hacks--org"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Auto-provision DNS + TLS for the live site (zone must be in this Cloudflare account)
[[routes]]
pattern = "combatmasterhacks.org"
custom_domain = true

[[routes]]
pattern = "www.combatmasterhacks.org"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://combatmasterhacks.org 301s always apply
run_worker_first = true
