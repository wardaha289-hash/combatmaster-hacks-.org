# Deploy the static Astro output from `npm run build`.
# Do not use @astrojs/cloudflare here — CI already builds `dist/` before `wrangler deploy`.
name = "combatmasterhacks-org"
compatibility_date = "2026-10-26"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
